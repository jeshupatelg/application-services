server:
  port: 8080
  servlet:
    context-path: /app/portfolio

spring:
  application:
    name: application-services
  datasource:
    url: jdbc:postgresql://host.minikube.internal:5432/portfoliodb
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

portfolio:
  sandbox:
    url: ${PORTFOLIO_SANDBOX_URL:http://localhost:80}

