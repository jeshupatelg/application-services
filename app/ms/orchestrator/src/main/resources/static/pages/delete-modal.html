<div class="modal-card">
    <div class="modal-header">
        <h2><i class="fa-solid fa-trash-can" style="color: #ef4444;"></i> Confirm Delete</h2>
        <button id="closeDeleteModalBtn" class="close-btn">&times;</button>
    </div>
    <div class="modal-body" style="color: var(--text-main); font-size: 0.9rem;">
        <p id="deleteMessage">Are you sure you want to delete the selected portfolio versions? This will transition them into archived/metadata-only states.</p>
        
        <div class="table-container" style="margin: 1.5rem 0; background: rgba(0, 0, 0, 0.25); border-radius: 12px; border: 1px solid var(--border-color); max-height: 250px; overflow-y: auto;">
            <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem;">
                <thead>
                    <tr style="border-bottom: 1px solid var(--border-color); opacity: 0.8;">
                        <th style="padding: 0.75rem 1rem; font-weight: 600; color: var(--text-muted);">VERSION</th>
                        <th style="padding: 0.75rem 1rem; font-weight: 600; color: var(--text-muted); text-align: right;">STATUS</th>
                    </tr>
                </thead>
                <tbody id="deleteModalTableBody">
                    <!-- Populated dynamically -->
                </tbody>
            </table>
        </div>
        
        <div class="modal-actions" style="margin-top: 2rem; display: flex; justify-content: flex-end; gap: 0.75rem;">
            <button type="button" id="cancelDeleteBtn" class="btn">Cancel</button>
            <button type="button" id="confirmDeleteBtn" class="btn btn-danger-action">
                <i class="fa-solid fa-trash"></i> Confirm Delete
            </button>
        </div>
    </div>
</div>
