<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication Required | Portfolio Orchestrator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Link Extracted CSS -->
    <link rel="stylesheet" href="/app/portfolio/admin/css/unauthorized.css">
</head>
<body>
    <div class="unauth-card">
        <div class="icon-container">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h1>Authentication Required</h1>
        <p>You must authenticate to access the portfolio orchestration panel. Please present a valid JSON Web Token (JWT) Bearer token.</p>
        <div class="details-box">
            <strong>Error Details:</strong> <span id="errorDetails">Loading error details...</span>
        </div>
        
        <!-- Local Developer Auth Helper -->
        <div class="dev-auth-section">
            <div class="dev-header">
                <i class="fa-solid fa-laptop-code"></i> Local Dev Auth Helper
            </div>
            <textarea id="tokenInput" placeholder="Paste raw JWT Bearer token here..."></textarea>
            <div class="dev-tip">The token will be injected into headers & cookies to authenticate local sessions.</div>
        </div>

        <button id="retryBtn" class="btn">
            <i class="fa-solid fa-arrows-rotate"></i> Retry Request
        </button>
    </div>

    <!-- Link Extracted JS -->
    <script src="/app/portfolio/admin/js/unauthorized.js" defer></script>
</body>
</html>
