services:
  portfolio-orchestrator:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    container_name: portfolio-orchestrator
    ports:
      - "8080:8080"
    volumes:
      - portfolio-static:/app/shared # Shared volume to store extracted static portfolios
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - PORTFOLIO_SHARED_DIR=/app/shared
      - PORTFOLIO_SANDBOX_URL=http://localhost:8081
    restart: on-failure

  portfolio-sandbox:
    image: nginx:alpine
    container_name: portfolio-sandbox
    ports:
      - "8081:80" # Safe port exposed publicly to read portfolios without hitting the Java backend
    volumes:
      - portfolio-static:/usr/share/nginx/html:ro # Mounted Read-Only to isolate executable code execution
    restart: always

volumes:
  portfolio-static:
