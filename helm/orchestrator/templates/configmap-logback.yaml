apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "application-services.fullname" . }}-logback
  labels:
    {{- include "application-services.labels" . | nindent 4 }}
data:
  logback.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <configuration>

        <appender name="STDOUT" class="ch.qos.logback.core.ConsoleAppender">
            <encoder>
                <pattern>%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n</pattern>
            </encoder>
        </appender>

        <!-- Global default level -->
        <root level="INFO">
            <appender-ref ref="STDOUT" />
        </root>

        <!-- Spring Web -->
        <logger name="org.springframework.web" level="INFO" />

        <!-- Security / Authentication tier -->
        <logger name="com.jpg.portfolio.orchestrator.security" level="DEBUG" />

        <!-- Application specific -->
        <logger name="com.jpg.portfolio.orchestrator" level="DEBUG" />

    </configuration>
