apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "application-services.fullname" . }}
  labels:
    {{- include "application-services.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "application-services.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "application-services.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "application-services.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: admin
              containerPort: {{ .Values.service.adminTargetPort | default 8080 }}
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.config.activeProfile | quote }}
            - name: CUSTOM_VAR
              value: {{ .Values.config.customVar | quote }}
            - name: JAVA_OPTS
              value: "-Dlogging.config=/config/logback.xml"
            - name: PORTFOLIO_SANDBOX_URL
              value: {{ .Values.sandbox.url | default (printf "http://%s/app/portfolio/display" .Values.ingress.host) | quote }}
          livenessProbe:
            httpGet:
              path: /app/portfolio/actuator/health/liveness
              port: admin
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /app/portfolio/actuator/health/readiness
              port: admin
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: portfolio-static
              mountPath: /app/shared
            - name: logback-config
              mountPath: /config
        - name: sandbox
          image: "{{ .Values.sandbox.image.repository }}:{{ .Values.sandbox.image.tag | default "alpine" }}"
          imagePullPolicy: {{ .Values.sandbox.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: display
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: portfolio-static
              mountPath: /usr/share/nginx/html/app/portfolio/display
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: portfolio-static
          emptyDir: {}
        - name: nginx-config
          configMap:
            name: {{ include "application-services.fullname" . }}-nginx-config
        - name: logback-config
          configMap:
            name: {{ include "application-services.fullname" . }}-logback
