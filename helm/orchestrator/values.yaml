# Default values for application-services.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: jeshupatelg/application-services
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "ed1"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  adminPort: 8080
  adminTargetPort: 8080
  displayPort: 80
  displayTargetPort: 80

sandbox:
  image:
    repository: nginx
    tag: alpine
    pullPolicy: IfNotPresent
  # Configure the external base URL for static display redirects. If left blank, 
  # it dynamically derives from http://<ingress.host>/app/portfolio/display.
  url: ""

ingress:
  enabled: true
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  
  # -- Double-Prefix / 504 Gateway Timeout Resolution --
  # If your app sees duplicated paths (e.g. /app/portfolio/app/portfolio/admin), 
  # set useRegex to true and specify the rewriteTarget below.
  # This will automatically render the correct Nginx Ingress regex annotations and paths.
  useRegex: false
  rewriteTarget: "" # e.g. "/app/portfolio/$1$2"
  
  host: application-services.local
  tls: []
  #  - secretName: application-services-tls

resources:
  # We establish reasonable resource limits and requests for a Spring Boot service.
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Application-specific environment configurations
config:
  activeProfile: "prod"
  customVar: "orchestrator-k8s-val"
